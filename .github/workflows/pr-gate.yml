name: PR gate

# Enforces the team charter (docs/team/README.md §3):
#  - every PR needs approved:tech-lead
#  - PRs touching contracts, ADRs, spec, design or model manifests also need approved:architect
#  - no outstanding needs:architect / needs:security
#  - new commits reset both approvals
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Reset approvals on new commits
        if: github.event.action == 'synchronize'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          for l in approved:tech-lead approved:architect; do
            gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label "$l" || true
          done

      - name: Check approvals
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          labels=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name')
          files=$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only)
          has() { grep -qxF "$1" <<<"$labels"; }
          fail=0

          if ! has approved:tech-lead; then
            echo "::error::Missing approved:tech-lead (every PR is gated by the Tech Lead)"
            fail=1
          fi

          if grep -qE '^(src/family_photo_curator/core/|docs/adr/|docs/spec/|docs/design/|models/manifests/)' <<<"$files"; then
            echo "This PR touches architect-owned paths."
            if ! has approved:architect; then
              echo "::error::Missing approved:architect (contracts, ADRs, spec, design or model manifests changed)"
              fail=1
            fi
          fi

          for l in needs:architect needs:security; do
            if has "$l"; then
              echo "::error::Outstanding $l review"
              fail=1
            fi
          done

          [ "$fail" -eq 0 ] && echo "Gate passed."
          exit "$fail"
